<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-labelledby="title description">
  <title id="title">Menishen Week 13 release-candidate CLI evidence</title>
  <desc id="description">Terminal-style evidence of a successful CLI analysis of a Week 12 RGB payload image using the locked ensemble configuration.</desc>
  <rect width="1220" height="760" fill="#0d1117"/>
  <rect x="0" y="0" width="1220" height="68" fill="#161b22"/>
  <circle cx="34" cy="34" r="10" fill="#ff5f57"/><circle cx="64" cy="34" r="10" fill="#febc2e"/><circle cx="94" cy="34" r="10" fill="#28c840"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#e6edf3">
    <text x="128" y="42">Windows PowerShell - Menishen Week 13 CLI release candidate</text>
    <text x="48" y="118" fill="#7ee787">&gt; .venv\Scripts\python.exe -m src.cli data\week12_payload_images\payload_100\pair_081_stego.png</text>
    <text x="48" y="178" font-weight="bold">Multi-Feature Steganalysis Toolkit - Release Candidate</text>
    <text x="48" y="218">Image: pair_081_stego.png (RGB)</text>
    <text x="48" y="266">Locked ensemble: Chi-square=0.00, RS=0.70, DH=0.30, threshold=0.70</text>
    <text x="48" y="326">Detector scores (raw -&gt; direction-aligned suspiciousness):</text>
    <text x="82" y="370">Chi-square: 1.0000 -&gt; 1.0000</text>
    <text x="82" y="412">RS:         0.0045 -&gt; 0.9955</text>
    <text x="82" y="454">DH:         0.4413 -&gt; 0.5587</text>
    <text x="48" y="522">Ensemble score (not a probability): 0.8645</text>
    <text x="48" y="580" fill="#7ee787" font-weight="bold">Final classification: Suspicious</text>
    <text x="48" y="692" fill="#8b949e">Menishen Week 13 - existing detectors and locked Week 10 configuration reused without modification.</text>
  </g>
</svg>
